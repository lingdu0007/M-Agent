[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "m-agent"
version = "0.2.0"
description = "An embeddable Agent Application Runtime for Python"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pydantic>=2"]
license = "Apache-2.0"
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/lingdu0007/M-Agent"
Security = "https://github.com/lingdu0007/M-Agent/security/advisories/new"

[project.optional-dependencies]
dev = ["packaging>=23", "pytest>=8.0.0", "httpx>=0.27"]
provider = ["httpx>=0.27"]
storage = []
telemetry = []
security = []
testing = ["packaging>=23"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "live: credential-gated contract tests against real model providers (opt-in, excluded from default CI)",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"m_agent.testing" = ["fixtures/*.json"]
